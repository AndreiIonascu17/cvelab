name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  signed-off:
    name: Signed-off-by
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify every commit carries a sign-off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          missing=0
          while read -r sha; do
            trailer="$(git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha")"
            if [[ -z "${trailer// }" ]]; then
              printf 'Missing Signed-off-by: %s %s\n' \
                "${sha:0:8}" "$(git show -s --format=%s "$sha")" >&2
              missing=1
            fi
          done < <(git rev-list "$BASE..$HEAD")
          if (( missing )); then
            cat >&2 <<'MSG'

          Every commit needs a Developer Certificate of Origin sign-off.
          See CONTRIBUTING.md. To fix the commits already pushed:

              git rebase --signoff <base>
              git push --force-with-lease

          MSG
            exit 1
          fi
          echo "All commits are signed off."
