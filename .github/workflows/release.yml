name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag matches the package version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - id: version
        run: |
          set -Eeuo pipefail
          project="$(python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$project" != "$tag" ]]; then
            echo "Tag v$tag does not match pyproject version $project" >&2
            exit 1
          fi
          echo "version=$project" >> "$GITHUB_OUTPUT"

  build:
    name: Build artifacts
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m pip install -e ".[dev]"
      - name: Run the test suite
        run: pytest
      - name: Build sdist and wheel
        run: python -m build
      - name: Check metadata
        run: twine check --strict dist/*
      - name: Build the Linux bundle
        run: bash scripts/build-linux.sh "$PWD/dist-linux"
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/*
            dist-linux/*

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cvelab
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: artifacts
      - name: Collect Python distributions
        run: |
          mkdir -p dist
          cp artifacts/dist/* dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Publish the GitHub release
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: artifacts
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "artifacts/dist/*, artifacts/dist-linux/*.tar.gz"
      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          name: CVELab ${{ needs.verify.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/dist/*
            artifacts/dist-linux/*
