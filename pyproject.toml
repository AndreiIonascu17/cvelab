[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvelab"
version = "0.4.0"
description = "Local-only CVE reproduction and PoC generator"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cvelab = "cvelab.cli:main"

[tool.setuptools]
packages = ["cvelab"]
